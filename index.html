    <meta

    <meta
      name="keywords"

    />
    <link rel="canonical" href="https://einadid.vercel.app/" />

    <!-- Open Graph -->

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Emamul Islam Nadid — Graphic Designer & Web Developer" />
    <meta
      name="twitter:description"

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Emamul Islam Nadid",
        "jobTitle": "Graphic Designer & Web Developer",
        "url": "https://einadid.vercel.app/",
        "email": "mailto:einadid0123@gmail.com",
        "telephone": "+8801678791177",

        "sameAs": [
          "https://github.com/einadid",
          "https://linkedin.com/in/einadid",
          "https://youtube.com/@einadid"
        ]
      }
    </script>

    <!-- Apply saved theme before paint to avoid a flash -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
